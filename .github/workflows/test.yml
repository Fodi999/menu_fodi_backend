name: Tests & Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Lint code (optional)
      run: |
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
        golangci-lint run ./... --timeout=5m || true

    - name: Run unit tests
      run: |
        source .env.test
        go test ./tests/unit/... -v -race -coverprofile=coverage-unit.out

    - name: Run API tests
      run: |
        source .env.test
        go test ./tests/api/... -v -race -coverprofile=coverage-api.out

    - name: Run E2E tests
      run: |
        source .env.test
        go test ./tests/e2e/... -v -timeout 30s -coverprofile=coverage-e2e.out

    - name: Run integration tests (optional)
      run: |
        source .env.test
        go test ./tests/integration/... -v -race || true

    - name: Merge coverage reports
      run: |
        go install github.com/wadey/gocovmerge@latest
        gocovmerge coverage-unit.out coverage-api.out coverage-e2e.out > coverage.out || true

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Display coverage stats
      run: |
        go tool cover -func=coverage.out | tail -1 || true

    - name: Run benchmarks (performance baseline)
      run: |
        source .env.test
        go test ./tests/benchmarks/... -bench=. -benchmem -run=^$ -timeout 30s > benchmark-results.txt || true

    - name: Archive benchmark results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-results
        path: benchmark-results.txt

    - name: Archive coverage reports
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: coverage-reports
        path: |
          coverage.out
          coverage-unit.out
          coverage-api.out
          coverage-e2e.out

  coverage-check:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Check Go files modified
      run: |
        echo "Test workflow completed successfully!"
        echo "- Unit tests: ✅"
        echo "- API tests: ✅"
        echo "- E2E tests: ✅"
        echo "- Coverage reports: Generated"
        echo "- Benchmarks: Completed"

  notify:
    runs-on: ubuntu-latest
    needs: [test, coverage-check]
    if: always()

    steps:
    - name: Notify on success
      if: success()
      run: echo "✅ All tests passed! Coverage reports are available in artifacts."

    - name: Notify on failure
      if: failure()
      run: echo "❌ Some tests failed. Check the logs above."
